name: "AIPM · Weekly topics & insights"
# Sundays: (1) Claude scans the web for timely, researched topics and adds them
# to the backlog with sources; (2) Instagram insights are imported (best effort)
# and the baseline-relative report is refreshed, which steers the planner.

on:
  schedule:
    - cron: "30 3 * * 0" # Sunday 09:00 IST
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Claude Code GitHub Action authentication

concurrency:
  group: aipm-main-writer
  cancel-in-progress: false

defaults:
  run:
    working-directory: ai-product-manager-content

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Topic scans use a paid writer, so they run only when AIPM_WRITER opts in.
      HAS_OAUTH: ${{ vars.AIPM_WRITER == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      USE_API: ${{ vars.AIPM_WRITER == 'api' }}
      AIPM_MODEL: ${{ vars.AIPM_MODEL || 'claude-opus-5-5' }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_LOGIN: ${{ vars.IG_LOGIN || 'instagram' }}
      IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v26.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare topic scan (Claude subscription)
        if: env.HAS_OAUTH == 'true'
        run: node scripts/daily/prepare-scan.mjs --count 4
      - name: Claude Code scans for timely topics (Claude subscription)
        if: env.HAS_OAUTH == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot],claude,github-actions[bot]"
          prompt: "Read ai-product-manager-content/output/daily/scan-brief.md and follow it exactly."
          claude_args: >-
            --model ${{ vars.AIPM_MODEL || 'claude-opus-5-5' }}
            --max-turns 30
            --allowedTools "Read,Write,WebSearch,WebFetch"
      - name: Add scanned topics to the backlog
        if: env.HAS_OAUTH == 'true'
        continue-on-error: true
        run: node scripts/daily/apply-scan.mjs
      - name: Scan for timely topics (Claude API)
        if: env.HAS_OAUTH != 'true'
        continue-on-error: true
        run: |
          if [ "$USE_API" = "true" ] && [ -n "$ANTHROPIC_API_KEY" ]; then node scripts/daily/scan-trends.mjs --count 4; else echo "Free mode: topic scan skipped (it needs a paid writer)."; fi
      - name: Import Instagram insights
        continue-on-error: true
        run: node scripts/daily/fetch-insights.mjs
      - name: Refresh performance report
        run: node scripts/analyze-performance.mjs
      - name: Commit
        run: scripts/daily/commit-to-main.sh "aipm - weekly topics and insights" data/topics/backlog.json data/performance
